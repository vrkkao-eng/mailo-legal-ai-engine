name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt ".[dev,research,service,retrieval]"
      - name: Ruff correctness lint
        run: ruff check mailo_cli tests
      - name: Typed core check
        run: mypy mailo_cli/regulatory mailo_cli/workflow_api.py mailo_cli/http_limits.py
      - name: Coverage
        run: python -m pytest -q --cov=mailo_cli --cov-report=term-missing --cov-fail-under=70

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -c constraints.txt ".[dev,research,service,retrieval]"
      - run: python -m pytest -q
      - run: python tools/validate_examples.py
      - run: python -m build --wheel --outdir dist
      - name: Wheel smoke test outside checkout
        shell: bash
        run: |
          python -m venv /tmp/mailo-wheel
          /tmp/mailo-wheel/bin/python -m pip install -c constraints.txt dist/*.whl
          cd /tmp
          /tmp/mailo-wheel/bin/mailo demo --output /tmp/mailo-demo
          /tmp/mailo-wheel/bin/mailo sparql --ontology /tmp/mailo-demo/findings.ttl --built-in cjeu_chain

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compose build and start
        run: docker compose --env-file .env.example up --detach --build
      - name: Health smoke test
        run: |
          for attempt in {1..10}; do
            curl --fail --silent http://localhost:8000/health && exit 0
            sleep 1
          done
          docker compose logs api
          exit 1
      - name: Persistent workflow volume smoke test
        run: |
          curl --fail --silent http://localhost:8000/operator/api/changes
          docker compose exec -T api python -c "import os; assert os.environ['MAILO_WORKFLOW_DB'] == '/data/workflow.db'"
          docker compose exec -T api test -f /data/workflow.db
      - name: Non-root installed runtime and readiness
        run: |
          docker compose exec -T api python -c "import os, mailo_cli; assert os.getuid() == 10001; assert '/site-packages/' in mailo_cli.__file__"
          curl --fail --silent http://localhost:8000/ready
      - name: Real chunked HTTP boundary smoke test
        run: python tools/runtime_smoke.py
      - if: always()
        run: docker compose down --volumes
