name: tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[dev,research,service,retrieval]"
      - run: python -m pytest -q
      - run: python tools/validate_examples.py
      - run: python -m build --wheel --outdir dist
      - name: Wheel smoke test outside checkout
        shell: bash
        run: |
          python -m venv /tmp/mailo-wheel
          /tmp/mailo-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/mailo-wheel/bin/mailo demo --output /tmp/mailo-demo
          /tmp/mailo-wheel/bin/mailo sparql --ontology /tmp/mailo-demo/findings.ttl --built-in cjeu_chain
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag mailo-api .
      - run: docker run --detach --name mailo-api --publish 8000:8000 mailo-api
      - name: Health smoke test
        run: |
          for attempt in {1..10}; do
            curl --fail --silent http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs mailo-api
          exit 1
      - if: always()
        run: docker rm --force mailo-api || true
